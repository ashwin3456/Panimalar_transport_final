<!DOCTYPE html>
<html>
<head>
  <title>Driver Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { padding: 10px; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <h2>Driver Dashboard</h2>
  <input type="number" id="busId" placeholder="Enter your Bus ID" />
  <button onclick="startTracking()">Start Sharing Location</button>

  <script>
    const socket = io();

    function startTracking() {
      const bus_id = parseInt(document.getElementById("busId").value);
      if (!bus_id) return alert("Enter valid Bus ID");

      if ("geolocation" in navigator) {
        setInterval(() => {
          navigator.geolocation.getCurrentPosition(pos => {
            const { latitude: lat, longitude: lng } = pos.coords;
            socket.emit("locationUpdate", { bus_id, lat, lng });
          });
        }, 5000); // Update every 5 seconds
      } else {
        alert("Geolocation not supported");
      }
    }
  </script>
</body>
</html>
