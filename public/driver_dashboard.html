<!DOCTYPE html>
<html>
<head>
  <title>Driver Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
  <style>
    :root{
      --bg:#0b1020;--panel:#0f172a;--brand:#3b82f6;--ok:#22c55e;--danger:#ef4444;--muted:#94a3b8;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(160deg,#0b1020,#0a1025 60%,#0b1020);color:#e5e7eb;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;height:100vh;display:grid;grid-template-columns:320px 1fr}
    #sidebar{background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border-right:1px solid #1f2a44;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
    #map{height:100vh;width:100%}
    h2{margin:8px 0 0;font-size:18px}
    select, button{width:100%;padding:12px;border-radius:12px;border:1px solid #1f2a44;background:#0b1328;color:#fff}
    button{cursor:pointer;font-weight:700;border:none}
    .btn-primary{background:linear-gradient(90deg,#3b82f6,#2563eb)}
    .btn-danger{background:#ef4444}
    .chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:#0a1222;border:1px solid #1f2a44;cursor:pointer}
    .chip img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid #1f2a44}
    .muted{color:var(--muted);font-size:12px}
    .section{padding:10px;border-radius:14px;background:#0a1222;border:1px solid #1f2a44}
    .footer{margin-top:auto;display:grid;gap:8px}
    .drawer{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none}
    .panel{position:absolute;left:16px;top:16px;bottom:16px;width:340px;background:#0b1220;border:1px solid #1f2a44;border-radius:16px;padding:16px;overflow:auto}
    .row{display:grid;gap:10px}
    label{font-size:12px;color:#cbd5e1}
    input[type="text"], input[type="tel"], input[type="email"]{width:100%;padding:10px;border-radius:10px;border:1px solid #1f2a44;background:#0a1222;color:#fff}
  </style>
</head>
<body>
  <div id="sidebar">
    <!-- Profile chip -->
    <div id="profileChip" class="chip" title="Open profile">
      <img id="chipImg" src="https://api.iconify.design/mdi:account-circle.svg?color=%23cbd5e1" alt="">
      <div>
        <div id="chipName">Driver</div>
        <div class="muted" id="chipEmail">-</div>
      </div>
    </div>

    <div class="section">
      <h2>Driver Bus Tracker</h2>
      <small class="muted">Choose your bus to start sharing location</small>
      <select id="busSelect"></select>
      <button id="startSharing" class="btn-primary">Start Sharing Location</button>
      <button id="stopSharing" class="btn-danger">Stop Sharing Location</button>
    </div>

    <div class="footer">
      <button id="logout" class="btn-danger">Logout</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Profile Drawer -->
  <div class="drawer" id="drawer">
    <div class="panel">
      <h2>My Profile</h2>
      <p class="muted">Edit your details and photo. Changes broadcast live.</p>
      <div class="row">
        <label>Photo</label>
        <img id="avatar" src="https://api.iconify.design/mdi:account-circle.svg?color=%23cbd5e1" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid #1f2a44" />
        <input type="file" id="photo" accept="image/*"/>
      </div>
      <div class="row" style="margin-top:6px">
        <label>Full Name</label>
        <input type="text" id="name"/>
        <label>Email</label>
        <input type="email" id="email" disabled/>
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="Optional"/>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="saveProfile" class="btn-primary">Save Profile</button>
        <button id="closeDrawer" class="ghost" style="background:#0a1222;border:1px solid #1f2a44;color:#cbd5e1">Close</button>
      </div>
      <div class="muted" id="pStatus" style="margin-top:8px"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ---------- auth/user ----------
    const user = JSON.parse(localStorage.getItem('user')||'null');
    if(!user || user.role!=='driver'){ /* location.href='login.html'; */ }

    // Profile chip display
    const chipName = document.getElementById('chipName');
    const chipEmail = document.getElementById('chipEmail');
    const chipImg = document.getElementById('chipImg');
    function setChip(u){
      chipName.textContent = u.name || 'Driver';
      chipEmail.textContent = u.email || '';
      chipImg.src = u.profile_photo ? ('/uploads/'+u.profile_photo) : 'https://api.iconify.design/mdi:account-circle.svg?color=%23cbd5e1';
    }
    setChip(user);

    // ---------- map ----------
    const socket = io();
    const map = L.map('map').setView([13.0827, 80.2707], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

    let routes = [];
    let routingControl = null;
    let stopMarkers = [];
    let selectedBusId = null;
    let locationWatcher = null;
    let liveMarker = null;

    async function loadBuses(){
      try{
        const r = await fetch('/buses'); if(!r.ok) throw 0;
        routes = await r.json();
      }catch{
        const r = await fetch('/buses.json'); routes = await r.json();
      }
      const sel = document.getElementById('busSelect');
      sel.innerHTML = '<option value="">--Select Bus--</option>';
      routes.forEach(r=>{
        sel.innerHTML += `<option value="${r.id}">${r.bus_number} - ${r.route_name}</option>`;
      });
    }
    loadBuses();

    document.getElementById('busSelect').addEventListener('change', ()=>{
      selectedBusId = document.getElementById('busSelect').value;
      if(selectedBusId){ showBusRoute(selectedBusId); if(liveMarker){ map.removeLayer(liveMarker); liveMarker=null; } }
    });

    function showBusRoute(busId){
      if(routingControl){ map.removeControl(routingControl); routingControl=null; }
      stopMarkers.forEach(m=>map.removeLayer(m)); stopMarkers=[];
      const bus = routes.find(r=> r.id==busId); if(!bus||!bus.stops.length) return;

      bus.stops.forEach(s=>{
        const m=L.marker([s.latitude,s.longitude]).addTo(map).bindPopup(s.stop_name); stopMarkers.push(m);
      });
      if(bus.stops.length>1){
        routingControl = L.Routing.control({
          waypoints: bus.stops.map(s=>L.latLng(s.latitude,s.longitude)),
          addWaypoints:false, draggableWaypoints:false, createMarker:()=>null, show:false,
          lineOptions:{styles:[{color:'dodgerblue',opacity:.85,weight:6}]}
        }).addTo(map);
        routingControl.on('routesfound', e=>{ if(e.routes.length) map.fitBounds(e.routes[0].bounds); });
      }else{
        map.setView([bus.stops[0].latitude,bus.stops[0].longitude],15);
      }
    }

    // driver live stream
    socket.on('driverLocationUpdate', data=>{
      if(String(data.busId)!==String(selectedBusId)) return;
      const latlng = [data.latitude, data.longitude];
      if(!liveMarker){
        liveMarker = L.marker(latlng, {icon:L.icon({iconUrl:'bus.png',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup('My Live Location');
      }else liveMarker.setLatLng(latlng);
    });

    document.getElementById('startSharing').onclick = ()=>{
      if(!selectedBusId) return alert('Select a bus first');
      if(navigator.geolocation){
        locationWatcher = navigator.geolocation.watchPosition(pos=>{
          socket.emit('driverLocation',{busId:selectedBusId,latitude:pos.coords.latitude,longitude:pos.coords.longitude});
        }, err=> alert('Error getting location: '+err.message), {enableHighAccuracy:true,maximumAge:0,timeout:10000});
      }else alert('Geolocation not supported');
    };

    document.getElementById('stopSharing').onclick = ()=>{
      if(locationWatcher){ navigator.geolocation.clearWatch(locationWatcher); locationWatcher=null; }
      if(selectedBusId) socket.emit('stopTrip', selectedBusId);
      if(liveMarker){ map.removeLayer(liveMarker); liveMarker=null; }
    };

    // ---------- profile drawer ----------
    const drawer = document.getElementById('drawer');
    const pStatus = document.getElementById('pStatus');
    const nameI = document.getElementById('name');
    const emailI = document.getElementById('email');
    const phoneI = document.getElementById('phone');
    const avatar = document.getElementById('avatar');
    const photo = document.getElementById('photo');

    function openDrawer(){ drawer.style.display='block'; loadProfile(); }
    function closeDrawer(){ drawer.style.display='none'; pStatus.textContent=''; }
    document.getElementById('profileChip').onclick = openDrawer;
    document.getElementById('closeDrawer').onclick = closeDrawer;
    drawer.onclick = (e)=>{ if(e.target===drawer) closeDrawer(); };

    async function loadProfile(){
      try{
        const r = await fetch(`/profile/${user.id}`);
        const u = await r.json();
        nameI.value = u.name||''; emailI.value = u.email||''; phoneI.value = u.phone||'';
        avatar.src = u.profile_photo ? ('/uploads/'+u.profile_photo) : 'https://api.iconify.design/mdi:account-circle.svg?color=%23cbd5e1';
      }catch(e){ pStatus.textContent='Failed to load profile'; }
    }

    document.getElementById('saveProfile').onclick = async ()=>{
      try{
        pStatus.textContent='Saving...';
        const fd = new FormData();
        fd.append('name', nameI.value);
        if(phoneI.value) fd.append('phone', phoneI.value);
        if(photo.files[0]) fd.append('photo', photo.files[0]);
        const r = await fetch(`/profile/${user.id}`, {method:'POST', body:fd});
        const j = await r.json();
        if(!r.ok) throw new Error(j.error||'Save failed');
        // update local + chip
        localStorage.setItem('user', JSON.stringify(j.user));
        setChip(j.user);
        avatar.src = j.user.profile_photo ? ('/uploads/'+j.user.profile_photo) : avatar.src;
        pStatus.textContent='Saved.';
      }catch(err){ pStatus.textContent = err.message; }
    };

    // live profile updates
    socket.on('profileUpdated', (u)=>{
      if(String(u.id)!==String(user.id)) return;
      localStorage.setItem('user', JSON.stringify(u));
      setChip(u);
      if(drawer.style.display==='block'){ 
        nameI.value=u.name||''; 
        phoneI.value=u.phone||''; 
        avatar.src=u.profile_photo?('/uploads/'+u.profile_photo):avatar.src; 
      }
    });

    // logout
    document.getElementById('logout').onclick = ()=>{
      localStorage.clear(); location.href='login1.html';
    };
  </script>
</body>
</html>
