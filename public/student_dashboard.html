<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Panimalar • Student Dashboard</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>
:root{
  --bg1:#08102a; --bg2:#14366a; --card:#ffffff; --muted:#6b7280;
  --accent:#2563eb; --success:#16a34a; --warn:#f59e0b;
}
html,body{height:100%; margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Arial;}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2)); color:#0b1220; display:flex; flex-direction:column;}
header{color:white; padding:14px 20px; display:flex; align-items:center; gap:12px; box-shadow:0 6px 18px rgba(2,6,23,.45);}
header .logo{display:flex; align-items:center; gap:10px; font-weight:700}
main{flex:1; display:grid; grid-template-columns:360px 1fr; gap:18px; padding:18px; max-width:1400px; margin:auto; grid-template-areas:"left right" "map map";}
@media(max-width:1000px){ main{grid-template-columns:1fr; grid-template-areas:"left" "right" "map"; padding:12px} }

/* Cards */
.card{background:var(--card); border-radius:12px; padding:16px; box-shadow:0 6px 22px rgba(2,6,23,.12);}
h3{margin:0 0 12px 0; color:#0f1724}

/* LEFT PANEL */
.left .plan-step{margin-bottom:14px;}
.left .plan-step label{font-size:13px; font-weight:600; color:var(--accent); margin-bottom:4px; display:block;}
.left .search-box input{width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:16px; font-size:14px;}
.left .search-box input:focus{outline:2px solid var(--accent); border-color:var(--accent);}
.left .plan-actions{display:flex; gap:10px; margin:12px 0;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:8px; background:var(--accent); color:white; border:none; cursor:pointer; font-weight:600;}
.btn-secondary{background:#64748b !important;}

/* Stops timeline */
.stops{max-height:46vh; overflow:auto; margin-top:10px;}
.stop{display:flex; gap:12px; align-items:center; margin-bottom:8px; position:relative;}
.stop::before{content:''; position:absolute; left:10px; top:0; bottom:0; width:2px; background:#e5e7eb; z-index:-1;}
.dot{width:14px;height:14px;border-radius:50%;background:#cbd5e1; z-index:2; flex-shrink:0;}
.stop.reached .dot{background:var(--success);}
.stop.next .dot{background:var(--warn);}
.stop-content{margin-left:8px; flex:1;}
.stop-content .name{font-weight:600;}
.stop-content small{color:var(--muted); font-size:12px;}

/* RIGHT PANEL */
.kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.kpi{background:#f8fafc; padding:12px; border-radius:10px; text-align:center;}
.ann{background:#f1f5f9; padding:10px; border-radius:8px; margin-bottom:8px; color:#0b1220; font-size:13px;}

/* Progress bar */
.progressWrap{background:#eef2ff;border-radius:999px;padding:6px;}
.progressBar{height:8px;background:linear-gradient(90deg,var(--accent),#60a5fa); border-radius:999px; width:0%;}

/* Map */
.map-card{grid-area:map;}
#map{height:65vh; border-radius:12px; overflow:hidden; margin-top:10px;}
</style>
</head>
<body>
<header>
  <div class="logo"><i class="fa-solid fa-bus" style="font-size:20px;color:#fff"></i>
    <div style="line-height:1">Panimalar Bus Tracker<br/><small style="font-size:11px;color:#dbeafe">Student Dashboard</small></div>
  </div>
  <div style="margin-left:auto;color:#fff" id="studentInfo">AJAY KUMAR — 23CSE042</div>
</header>

<main>
  <!-- LEFT PANEL -->
  <div class="left card" style="grid-area:left">
    <h3><i class="fa-solid fa-route" style="color:var(--accent)"></i> Plan & Track</h3>

    <div class="search-box">
      <input id="searchInput" placeholder="🔍 Search by stop, route, or bus…"/>
    </div>

    <div class="plan-actions">
      <button class="btn btn-secondary" id="clearTracking"><i class="fa-solid fa-xmark"></i> Clear</button>
    </div>

    <hr/>
    <div>
      <h4 style="margin:0 0 8px 0">📍 Route Stops</h4>
      <div class="stops" id="stopsList">Search to view stops…</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right card" style="grid-area:right">
    <h3>Live Status</h3>
    <div class="kpi-grid">
      <div class="kpi"><div class="small">Current Stop</div><div id="kpiCurrent" style="font-weight:700">—</div></div>
      <div class="kpi"><div class="small">Next Stop</div><div id="kpiNext" style="font-weight:700">—</div></div>
      <div class="kpi"><div class="small">ETA</div><div id="kpiETA" style="font-weight:700">—</div></div>
      <div class="kpi"><div class="small">Speed</div><div id="kpiSpeed" style="font-weight:700">— km/h</div></div>
    </div>

    <hr style="margin:12px 0"/>
    <div class="ann"><strong>Announcements</strong><div id="annList"><small>No announcements</small></div></div>

    <div style="margin-top:12px">
      <button class="btn" id="locateMe"><i class="fa-solid fa-location-crosshairs"></i> Locate me</button>
    </div>
  </div>

  <!-- BOTTOM: Map -->
  <div class="map-card card">
    <h3>Live Map</h3>
    <div id="map" aria-label="Live bus map"></div>
    <div style="display:flex; align-items:center; gap:12px; margin-top:12px">
      <div style="flex:1">
        <div class="small">Progress</div>
        <div class="progressWrap"><div class="progressBar" id="progressBar"></div></div>
      </div>
      <div style="min-width:140px">
        <div class="small">Last update</div>
        <div id="lastUpdate">—</div>
      </div>
    </div>
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
let buses=[], stops=[], routes=[];
let activeRoute=null, activeBus=null;
let map, busMarker=null, routeLine=null, stopMarkers={};
let socket=io();

function $(id){return document.getElementById(id);}

function initMap(){
  map=L.map('map').setView([13.06,80.15],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
}

async function loadData(){
  const res=await fetch('/api/data'); 
  const json=await res.json();
  buses=json.buses||[]; stops=json.stops||[]; routes=json.routeOrder||[];
}

// Render route polyline and stops
function renderRoute(idx=0){
  if(routeLine){map.removeLayer(routeLine);} 
  Object.values(stopMarkers).forEach(m=>map.removeLayer(m)); stopMarkers={};
  if(!activeRoute) return;

  const latlngs=[];
  activeRoute.stops.forEach((id,i)=>{
    const s=stops.find(x=>x.id===id); if(!s) return;
    latlngs.push([s.lat,s.lng]);
    stopMarkers[s.id]=L.circleMarker([s.lat,s.lng],{radius:7,color:'#2563eb',fillColor:'#bfdbfe',fillOpacity:1})
      .addTo(map)
      .bindPopup(`<b>${s.name}</b><br><small>${s.time||''}</small>`);
  });

  if(latlngs.length){
    routeLine=L.polyline(latlngs,{color:'#2563eb',weight:5}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[40,40]});
  }
  renderStopsTimeline(idx);
}

// Update stops timeline
function renderStopsTimeline(idx){
  const c=$('stopsList'); c.innerHTML='';
  if(!activeRoute) return;
  activeRoute.stops.forEach((sid,i)=>{
    const s=stops.find(x=>x.id===sid); if(!s) return;
    const div=document.createElement('div');
    div.className='stop'+(i<idx?' reached':'')+(i===idx?' next':'');
    div.innerHTML=`<div class="dot"></div><div class="stop-content"><div class="name">${s.name}</div><small>${s.time||''}</small></div>`;
    c.appendChild(div);
  });
}

// Update KPI based on bus position
function updateKPI(currIdx){
  if(!activeRoute) return;
  const stopsArr = activeRoute.stops.map(id=>stops.find(s=>s.id===id));
  $('kpiCurrent').textContent = stopsArr[currIdx]?.name||'—';
  $('kpiNext').textContent = stopsArr[currIdx+1]?.name||'—';
  // ETA (fake for demo)
  $('kpiETA').textContent = stopsArr[currIdx+1]?Math.max(1,(stopsArr[currIdx+1].time||5))+' min':'—';
  $('kpiSpeed').textContent = Math.floor(Math.random()*40+20)+' km/h';
  const progress = ((currIdx)/(stopsArr.length-1))*100;
  $('progressBar').style.width = progress+'%';
}

// Place or move bus marker
function placeBusMarker(lat,lng){
  if(!busMarker){busMarker=L.marker([lat,lng],{icon:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/61/61231.png',iconSize:[32,32]})}).addTo(map);}
  else{busMarker.setLatLng([lat,lng]);}

  // Update nearest stop and KPI
  if(activeRoute){
    let nearestIdx=0, minDist=Infinity;
    activeRoute.stops.forEach((sid,i)=>{
      const s = stops.find(x=>x.id===sid);
      if(!s) return;
      const dist = Math.sqrt(Math.pow(s.lat-lat,2)+Math.pow(s.lng-lng,2));
      if(dist<minDist){minDist=dist; nearestIdx=i;}
    });
    renderStopsTimeline(nearestIdx);
    updateKPI(nearestIdx);
  }
}

// Search function
function searchAndUpdate(q){
  if(!q) return;
  q = q.toLowerCase();
  let stop = stops.find(s=>s.name.toLowerCase().includes(q));
  if(stop){
    const route = routes.find(r=>r.stops.includes(stop.id));
    if(route){activeRoute = route; renderRoute(route.stops.indexOf(stop.id));}
    const marker = stopMarkers[stop.id];
    if(marker){map.setView([stop.lat, stop.lng],15); marker.openPopup();}
    return;
  }
  let routeMatch = routes.find(r=>r.name.toLowerCase().includes(q));
  if(routeMatch){activeRoute = routeMatch; renderRoute(); return;}
  let busMatch = buses.find(b => b.name.toLowerCase().includes(q) || (b.number||'').toLowerCase().includes(q));
  if(busMatch){
    const route = routes.find(r => r.buses.includes(busMatch.id));
    if(route){activeRoute = route; renderRoute(); placeBusMarker(busMatch.lat||0,busMatch.lng||0);}
  }
}

// Live updates from server
socket.on('locationUpdate',data=>{
  activeBus = buses.find(b=>b.id===data.busId);
  if(activeBus){placeBusMarker(data.lat,data.lng); $('lastUpdate').textContent = new Date().toLocaleTimeString();}
});

// INIT
window.addEventListener('load',()=>{
  initMap(); loadData();
  $('searchInput').addEventListener('input',e=>{searchAndUpdate(e.target.value);});
  $('locateMe').onclick=()=>{if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],14); L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup("You are here").openPopup();});}
  $('clearTracking').onclick=()=>{
    activeRoute=null; activeBus=null;
    Object.values(stopMarkers).forEach(m=>map.removeLayer(m)); stopMarkers={};
    if(routeLine){map.removeLayer(routeLine);}
    renderStopsTimeline(0);
    $('progressBar').style.width='0%';
    $('kpiCurrent').textContent='—';
    $('kpiNext').textContent='—';
    $('kpiETA').textContent='—';
    $('kpiSpeed').textContent='— km/h';
    $('lastUpdate').textContent='—';
  }
});
})();
</script>
</body>
</html>
