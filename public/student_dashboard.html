<!DOCTYPE html>
<html>
<head>
  <title>Student/Faculty Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map("map").setView([13.0827, 80.2707], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    const busMarkers = {};

    function updateMarker(bus_id, lat, lng) {
      if (busMarkers[bus_id]) {
        busMarkers[bus_id].setLatLng([lat, lng]);
      } else {
        busMarkers[bus_id] = L.marker([lat, lng]).addTo(map)
          .bindPopup("Bus ID: " + bus_id);
      }
    }

    // Load initial bus data
    fetch("/get-buses")
      .then(res => res.json())
      .then(data => {
        data.forEach(bus => {
          if (bus.lat && bus.lng) {
            updateMarker(bus.id, bus.lat, bus.lng);
          }
        });
      });

    const socket = io();
    socket.on("busLocationUpdate", data => {
      const { bus_id, lat, lng } = data;
      updateMarker(bus_id, lat, lng);
    });
  </script>
</body>
</html>
