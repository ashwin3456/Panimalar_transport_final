<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #8e44ad;
            --accent-color: #9b59b6;
            --text-color: #333;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 15px 0;
            box-shadow: var(--shadow);
            position: relative;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .search-container {
            display: flex;
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 20px 0 0 20px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-display {
            font-size: 14px;
            text-align: right;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            gap: 15px;
        }

        .nav-btn {
            flex: 1;
            background: var(--white);
            border: none;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .nav-btn i {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .nav-btn span {
            font-size: 14px;
            font-weight: 500;
        }

        /* Date Navigation */
        .date-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            margin: 20px 0;
            scrollbar-width: none; /* Firefox */
        }

        .date-nav::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .date-btn {
            min-width: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: var(--white);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .date-btn.today {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .date-btn .day {
            font-weight: bold;
            display: block;
        }

        .date-btn .date {
            font-size: 12px;
        }

        /* Content Area */
        .content-area {
            background: var(--white);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: var(--shadow);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .route-details-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .route-details-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        /* Map Container */
        #map {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .search-container {
                width: 100%;
                margin: 10px 0;
            }
            
            .nav-buttons {
                flex-direction: column;
            }
            
            .date-nav {
                padding-bottom: 5px;
            }
            
            .date-btn {
                min-width: 70px;
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">Student Bus Tracker</div>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Enter route/stop (min 4 letters)">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
                <div class="time-display" id="currentTime">Current Time: 3:59:18 PM (Thu, 25 Dec, 2025)</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn" id="locationMapBtn">
                <i class="fas fa-map-marked-alt"></i>
                <span>Location Map</span>
            </button>
            <button class="nav-btn" id="busesPositionBtn">
                <i class="fas fa-bus"></i>
                <span>Buses Position</span>
            </button>
            <button class="nav-btn" id="helplineBtn">
                <i class="fas fa-phone-alt"></i>
                <span>Helpline</span>
            </button>
        </div>

        <div class="date-nav">
            <button class="date-btn">
                <span class="day">HOME</span>
            </button>
            <button class="date-btn">
                <span class="day">22nd</span>
                <span class="date">Mon</span>
            </button>
            <button class="date-btn">
                <span class="day">23rd</span>
                <span class="date">Tue</span>
            </button>
            <button class="date-btn">
                <span class="day">24th</span>
                <span class="date">Wed</span>
            </button>
            <button class="date-btn today">
                <span class="day">25th</span>
                <span class="date">Thu</span>
            </button>
            <button class="date-btn">
                <span class="day">26th</span>
                <span class="date">Fri</span>
            </button>
            <button class="date-btn">
                <span class="day">27th</span>
                <span class="date">Sat</span>
            </button>
            <button class="date-btn">
                <span class="day">28th</span>
                <span class="date">Sun</span>
            </button>
            <button class="date-btn">
                <span class="day">29th</span>
                <span class="date">Mon</span>
            </button>
        </div>

        <div class="content-area">
            <div style="text-align: center;">
                <h2 style="color: var(--primary-color); margin-bottom: 10px;">Thu, 25th Dec, 2025</h2>
                <div style="background: #f0f0f0; padding: 15px; border-radius: 8px; display: inline-block; margin: 10px 0;">
                    Merry Christmas
                </div>
            </div>
            <button class="route-details-btn">All Route Details - click here</button>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Update current time
        function updateCurrentTime() {
            const now = new Date();
            const options = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true,
                weekday: 'short',
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            };
            const timeString = now.toLocaleTimeString('en-US', options);
            document.getElementById('currentTime').textContent = `Current Time: ${timeString}`;
        }

        // Update time every second
        updateCurrentTime();
        setInterval(updateCurrentTime, 1000);

        // Initialize map (hidden by default)
        let map = L.map('map', { zoomControl: true }).setView([13.064, 80.248], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Navigation button click handlers
        document.getElementById('locationMapBtn').addEventListener('click', function() {
            // Toggle map visibility
            const mapElement = document.getElementById('map');
            mapElement.style.display = mapElement.style.display === 'none' ? 'block' : 'none';
            
            if (mapElement.style.display === 'block') {
                setTimeout(() => {
                    map.invalidateSize();
                }, 300);
            }
        });

        document.getElementById('busesPositionBtn').addEventListener('click', function() {
            alert('Buses position feature will be implemented here');
            // TODO: Implement buses position functionality
        });

        document.getElementById('helplineBtn').addEventListener('click', function() {
            alert('Helpline: 1800-123-4567\nEmail: support@panimalar.edu.in');
        });

        // Date navigation
        const dateButtons = document.querySelectorAll('.date-btn');
        dateButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remove 'today' class from all buttons
                dateButtons.forEach(btn => btn.classList.remove('today'));
                // Add 'today' class to clicked button if it's not the HOME button
                if (!this.textContent.includes('HOME')) {
                    this.classList.add('today');
                }
                // TODO: Update content based on selected date
            });
        });

        // Route details button
        document.querySelector('.route-details-btn').addEventListener('click', function() {
            alert('Route details will be displayed here');
            // TODO: Implement route details functionality
        });

        // Search functionality
        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-btn');
        
        function performSearch() {
            const query = searchInput.value.trim();
            if (query.length >= 4) {
                // TODO: Implement search functionality
                console.log('Searching for:', query);
                alert(`Searching for: ${query}`);
            } else if (query.length > 0) {
                alert('Please enter at least 4 characters');
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Initialize with current date selected
        const todayBtn = document.querySelector('.date-btn.today');
        if (todayBtn) {
            todayBtn.click();
        }
    </script>

</body>
</html>
