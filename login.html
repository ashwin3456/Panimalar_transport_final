<!-- DASHBOARD 1: Admin Dashboard (admin.html) -->
<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    img.logo {
      max-width: 200px;
      height: auto;
      display: block;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <img src="163efa95-7c84-4fc4-9356-ff5cbe4ee2cd.png" alt="Logo" class="logo">
  <h1>Admin Dashboard</h1>

  <form id="addBusForm">
    <input placeholder="Bus Name" id="busName" required>
    <input placeholder="Bus No" id="busNo" required>
    <input placeholder="Driver ID" id="driverId" required>
    <button type="submit">Add Bus</button>
  </form>

  <form id="addStopForm">
    <input placeholder="Stop Name" id="stopName" required>
    <input placeholder="Latitude" id="stopLat" required>
    <input placeholder="Longitude" id="stopLng" required>
    <button type="submit">Add Stop</button>
  </form>

  <script>
    const socket = io('http://localhost:3000');

    document.getElementById('addBusForm').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('busName').value;
      const number = document.getElementById('busNo').value;
      const driver_id = document.getElementById('driverId').value;
      await fetch('http://localhost:3000/admin/bus', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, number, driver_id })
      });
    };

    document.getElementById('addStopForm').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('stopName').value;
      const lat = document.getElementById('stopLat').value;
      const lng = document.getElementById('stopLng').value;
      await fetch('http://localhost:3000/admin/stop', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, lat, lng })
      });
    };
  </script>
</body>
</html>
